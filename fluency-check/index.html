<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const code=(new URLSearchParams(location.search).get('class')||'').toUpperCase().trim();
  window.__class=null; window.__classError=null; window.__submit=async()=>false;
  if(code){
    try{
      const { firebaseConfig } = await import("./firebase-config.js");
      const db=getFirestore(initializeApp(firebaseConfig));
      const snap=await getDoc(doc(db,'classes',code));
      if(snap.exists()){
        window.__class={code,name:snap.data().name||'Your class'};
        window.__submit=async(r)=>{ try{ await addDoc(collection(db,'classes',code,'results'),{...r,submittedAt:serverTimestamp()}); return true; }catch(e){ console.error(e); return false; } };
      } else { window.__classError="That class code wasn't found. Check it with your teacher."; }
    }catch(e){ window.__classError="Couldn't connect to the class. Try again, or let your teacher know."; console.error(e); }
  }
  window.dispatchEvent(new Event('nhfirebase'));
</script>

  {s:"choice", q:"What's an efficient way to work out 50 × 6?", o:[["Think 100 × 6 = 600, then halve → 300",1],["Add 50 six times","slow"],["Long multiplication","harder than needed"],["50 × 3 only","unfinished"]]},
];

let queue=[], at=0, answers=[], shownAt=0, initials="";
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function arraySVG(r,c){ const g=22,pad=8,rad=7; const w=pad*2+(c-1)*g+rad*2, h=pad*2+(r-1)*g+rad*2;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  for(let i=0;i<r;i++)for(let j=0;j<c;j++){ s+=`<circle cx="${pad+rad+j*g}" cy="${pad+rad+i*g}" r="${rad}" fill="#23314F"/>`; }
  return s+`</svg>`; }

function boot(){
  const code=new URLSearchParams(location.search).get('class');
  if(!CLASS_OPEN || !code){ landing(); return; }
  $('screen').innerHTML=`<div class="panel"><p class="muted">Loading your class…</p></div>`;
  const go=()=>{
    if(window.__class){ $('classtag').innerHTML=`Class: ${window.__class.name}`; $('classtag').className='classtag'; joinScreen(); }
    else { $('screen').innerHTML=`<div class="panel"><p class="lead">${window.__classError||'Class not found.'}</p></div>`; }
  };
  if(window.__class||window.__classError) go(); else window.addEventListener('nhfirebase',go,{once:true});
}
function landing(){
  $('screen').innerHTML=`<div class="panel">
    <p class="lead">A short diagnostic of how flexibly a student understands multiplication — not just recall, but the models, strategies and reasoning behind it.</p>
    <div class="center mt"><button class="btn primary" id="free">Start the check →</button></div>
    <p class="fine">No sign-up, nothing stored — your result shows once, on screen.</p>
    <div class="orline"><span>class mode</span></div>
    <label class="inilabel" style="display:block">Join your class <span class="soon">Coming soon</span></label>
    <div class="joinrow">
      <input class="codein" placeholder="CODE" disabled aria-label="Class code (coming soon)">
      <button class="btn primary" disabled>Join →</button>
    </div>
    <p class="fine" style="text-align:left;margin-top:6px">Class dashboards are coming soon — we're finalising our data &amp; privacy policy before collecting any student data.</p>
  </div>
  <p class="teacherlink">Teacher? <span style="color:var(--muted)">Class dashboards coming soon.</span></p>
  <div class="center" style="margin-top:18px"><a class="btn ghost" href="${PG}">← Back to the Playground</a></div>`;
  $('free').onclick=intro;
}
function intro(){
  $('screen').innerHTML=`<div class="panel">
    <p class="lead">This isn't a times-table quiz. It checks how <b>flexibly</b> a student understands multiplication, across five areas:</p>
    <ul class="areas">
      <li><span class="n">I</span><span><b>Number facts</b> — reliable recall, including ×10 and ×100.</span></li>
      <li><span class="n">II</span><span><b>Models</b> — arrays, area and equal groups.</span></li>
      <li><span class="n">III</span><span><b>Strategies</b> — double & halve, partition, factor.</span></li>
      <li><span class="n">IV</span><span><b>Flexibility</b> — factor links like "if 6 is a factor of 42, so is 3", and scaling.</span></li>
      <li><span class="n">V</span><span><b>Strategic choice</b> — picking the efficient method.</span></li>
    </ul>
    <p class="muted mt">${PER*ORDER.length} questions, about 10 minutes. No timer, no sign-up. You'll get a plain-language profile of where things are solid and where some practice would help.</p>
    <div class="center mt"><button class="btn primary" id="start">Begin the check →</button></div>
    <p class="fine">Nothing is stored — your result shows once, on screen.</p>
  </div>`;
  $('start').onclick=start;
}
function joinScreen(){
  $('screen').innerHTML=`<div class="panel center">
    <p class="lead" style="text-align:center">You've joined <b>${window.__class.name}</b>.</p>
    <p class="muted" style="margin-top:6px">Enter your initials (up to 3 letters) so your teacher can find your result.</p>
    <label class="inilabel" for="ini" style="display:block;margin-top:14px">Your initials</label>
    <input id="ini" class="iniin" maxlength="3" autocomplete="off" placeholder="ABC" aria-label="Your initials">
    <div class="mt"><button class="btn primary" id="join" disabled>Begin the check →</button></div>
    <p class="fine">Only your initials are stored — never your full name.</p>
  </div>`;
  const inp=$('ini'), jb=$('join');
  inp.addEventListener('input',()=>{ inp.value=inp.value.replace(/[^a-zA-Z]/g,'').toUpperCase(); jb.disabled=inp.value.length<1; });
  jb.onclick=()=>{ initials=inp.value.slice(0,3); start(); };
  inp.focus();
}
function pickSet(){ const byS={}; ORDER.forEach(s=>byS[s]=[]); ITEMS.forEach(it=>byS[it.s].push(it));
  let chosen=[]; ORDER.forEach(s=>{ chosen=chosen.concat(shuffle(byS[s]).slice(0,PER)); }); return shuffle(chosen); }
function start(){ queue=pickSet(); at=0; answers=[]; window.nhTrack&&nhTrack('assessment_start',{items:queue.length,mode:(CLASS_OPEN&&window.__class)?'class':'free'}); renderQ(); }
function renderQ(){
  const it=queue[at]; const opts=shuffle(it.o);
  let optHTML="";
  opts.forEach((o,i)=>{ optHTML+=`<button class="opt" data-i="${i}"><span class="ltr">${String.fromCharCode(65+i)}</span><span class="txt">${o[0]}</span></button>`; });
  $('screen').innerHTML=`<div class="panel">
    <div class="qtop"><span class="qn">Question ${at+1} / ${queue.length}</span><span class="pill">${STRANDS[it.s].nm}</span></div>
    <div class="bar"><i style="width:${Math.round(at/queue.length*100)}%"></i></div>
    <div class="q">${it.q}</div>
    ${it.arr?`<div class="arr">${arraySVG(it.arr[0],it.arr[1])}</div>`:""}
    <div class="opts" id="opts">${optHTML}</div>
  </div>
  <div class="center" style="margin-top:14px"><a class="pgback" href="${PG}">← Back to the Playground</a></div>`;
  const btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,i)=>{ b.onclick=()=>pick(it,opts[i],b); });
  shownAt=performance.now();
}
function pick(it,o,btn){
  document.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none'); btn.classList.add('pick');
  const rt=(performance.now()-shownAt)/1000;
  answers.push({s:it.s, correct:o[1]===1, tag:(o[1]===1?null:o[1]), rt});
  setTimeout(()=>{ at++; if(at<queue.length) renderQ(); else results(); }, 260);
}
function flagFor(p){ return p>=0.8?"secure":p>=0.5?"developing":"needs"; }
function flagLabel(f){ return f==="secure"?"Solid":f==="developing"?"Developing":"Needs work"; }
function flagColor(f){ return f==="secure"?"var(--ok)":f==="developing"?"var(--warn)":"var(--bad)"; }
function results(){
  const by={}; ORDER.forEach(s=>by[s]={n:0,c:0});
  answers.forEach(a=>{ by[a.s].n++; if(a.correct)by[a.s].c++; });
  const pct={}; ORDER.forEach(s=>pct[s]=by[s].n?by[s].c/by[s].n:0);
  const times=answers.map(a=>a.rt).sort((x,y)=>x-y); const med=times.length?times[Math.floor(times.length/2)]:0;
  const pace=med<6?"brisk":med<12?"steady":"takes a little time";
  const rank={flex:0,choice:1,strategies:2,models:3,recall:4};
  const focus=ORDER.slice().sort((a,b)=> (pct[a]-pct[b]) || (rank[a]-rank[b]) )[0];
  const overall=Math.round(ORDER.reduce((s,k)=>s+pct[k],0)/ORDER.length*100);
  const P={}; ORDER.forEach(s=>P[s]=Math.round(pct[s]*100));

  const inClass = CLASS_OPEN && window.__class;
  let sentHTML="";
  if(inClass){
    sentHTML=`<div class="sent" id="sent">Sending to ${window.__class.name}…</div>`;
    window.__submit({initials:initials||"",overall,recall:P.recall,models:P.models,strategies:P.strategies,flex:P.flex,choice:P.choice,focus,median_s:Math.round(med*10)/10})
      .then(ok=>{ const el=$('sent'); if(el){ el.textContent= ok?`Sent to ${window.__class.name}`:"Couldn't send — show this screen to your teacher."; if(!ok)el.style.color="var(--bad)"; } });
  }
  let strandHTML="";
  ORDER.forEach(s=>{ const f=flagFor(pct[s]); const m=STRANDS[s];
    strandHTML+=`<div class="srow">
      <div class="shead"><span class="snm">${m.nm}</span><span class="sflag ${f}">${flagLabel(f)}</span></div>
      <div class="smeter"><div class="track"><i style="width:${P[s]}%;background:${flagColor(f)}"></i></div><span class="spct">${P[s]}%</span></div>
      <div class="sds">${m.ds}${f!=="secure"?` &nbsp;<a class="fix" href="${m.href}" target="_blank" rel="noopener" data-strand="${s}">→ ${m.fix}</a>`:""}</div>
    </div>`; });
  const fm=STRANDS[focus];
  $('screen').innerHTML=`<div class="panel">
    ${sentHTML}
    <div class="ring" style="--p:${overall}"><div class="inner"><span class="num">${overall}%</span><span class="lab">overall</span></div></div>
    <div class="pace">pace · ${pace}</div>
    <div class="pacenote">Not a race. This is just a sense of whether facts come to mind readily enough to leave room for thinking — so working them out doesn't get in the way of the reasoning.</div>
    <div class="focus"><div class="fl">Priority area: <b>${fm.nm}</b></div>
      <a class="fix" href="${fm.href}" target="_blank" rel="noopener" data-strand="${focus}" style="font-size:13.5px">→ ${fm.fix}</a></div>
    <div class="seclabel">Profile</div>
    ${strandHTML}
    <div class="center mt"><button class="btn primary" id="report">⬇ Download my report (PDF)</button></div>
    <p class="fine">Save it, or email it to your teacher.</p>
    <div class="center mt"><a class="btn ghost" href="${PG}">← Back to the Playground</a></div>
    ${inClass?"":`<div class="center mt"><button class="btn ghost" id="again">Take it again</button></div>`}
  </div>`;
  function makeReport(){ const btn=$('report'); if(btn){btn.disabled=true;btn.textContent="Preparing…";}
    loadJsPDF(()=>{ try{
      const { jsPDF }=window.jspdf; const d=new jsPDF({unit:'pt',format:'a4'});
      const M=56, W=d.internal.pageSize.getWidth(), H=d.internal.pageSize.getHeight(); let y=66;
      d.setFont('helvetica','bold'); d.setFontSize(20); d.setTextColor(35,49,79); d.text("Multiplication Fluency Check", M, y);
      d.setFont('helvetica','normal'); d.setFontSize(11); d.setTextColor(120); y+=18; d.text("My fluency report", M, y);
      d.setDrawColor(210); d.line(M, y+12, W-M, y+12); y+=36;
      d.setTextColor(40); d.setFontSize(11);
      d.text((initials?("Name / initials: "+initials+"          "):"")+"Date: "+new Date().toLocaleDateString(), M, y); y+=28;
      d.setFont('helvetica','bold'); d.setFontSize(14); d.setTextColor(35,49,79);
      d.text("Overall fluency: "+overall+"%          Pace: "+pace, M, y); y+=16;
      d.setFont('helvetica','italic'); d.setFontSize(9.5); d.setTextColor(120);
      { const el=d.splitTextToSize("Pace is a gentle gauge, not a speed test — the aim is for facts to come to mind readily enough that they don't crowd out the reasoning.", W-2*M); d.text(el, M, y); y+=el.length*12+16; }
      d.setFont('helvetica','bold'); d.setFontSize(13); d.setTextColor(40); d.text("What I can do", M, y); y+=19;
      d.setFont('helvetica','normal'); d.setFontSize(11.5); let anyCan=false;
      ORDER.forEach(s=>{ if(flagFor(pct[s])==='secure'){ anyCan=true; const L=d.splitTextToSize("I can "+CANDO[s].can+".", W-2*M-16); d.text("-", M, y); d.text(L, M+16, y); y+=L.length*15+5; } });
      if(!anyCan){ d.setTextColor(120); d.text("Not yet — but every area below has a clear next step.", M, y); d.setTextColor(40); y+=19; }
      y+=10; d.setFont('helvetica','bold'); d.setFontSize(13); d.text("What I'm working on", M, y); y+=19;
      d.setFont('helvetica','normal'); d.setFontSize(11.5); let anyNext=false;
      ORDER.forEach(s=>{ if(flagFor(pct[s])!=='secure'){ anyNext=true;
        const L=d.splitTextToSize(STRANDS[s].nm+" ("+P[s]+"%): "+CANDO[s].next, W-2*M-16);
        d.setTextColor(40); d.setFont('helvetica','normal'); d.text("-", M, y); d.text(L, M+16, y); y+=L.length*15+1;
        d.setTextColor(35,49,79); d.setFont('helvetica','bold'); d.textWithLink("> "+STRANDS[s].fix, M+16, y, {url:STRANDS[s].href}); y+=19;
      } });
      if(!anyNext){ d.setTextColor(120); d.text("All five areas are solid — excellent work!", M, y); d.setTextColor(40); y+=19; }
      y+=14; d.setFont('helvetica','bold'); d.setFontSize(11.5); d.setTextColor(26,36,57);
      const pl=d.splitTextToSize("Priority area: "+STRANDS[focus].nm+" — "+CANDO[focus].next, W-2*M-20);
      const boxH=pl.length*14+30;
      d.setFillColor(231,234,241); d.rect(M, y-14, W-2*M, boxH, 'F');
      d.text(pl, M+10, y+2);
      d.setTextColor(35,49,79); d.textWithLink("> "+STRANDS[focus].fix, M+10, y+2+pl.length*14+2, {url:STRANDS[focus].href});
      y = y-14 + boxH + 18;
      d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor(140);
      d.text("Generated by Number Hive  -  Multiplication Fluency Check", M, H-40);
      d.save("MFC-report"+(initials?("-"+initials):"")+".pdf");
      window.nhTrack&&nhTrack('report_download',{overall:overall,focus:focus});
    }catch(e){ console.error(e); alert("Sorry — couldn't make the PDF. Try your browser's Print → Save as PDF."); }
      finally{ if(btn){btn.disabled=false;btn.textContent="⬇ Download my report (PDF)";} } });
  }
  document.querySelectorAll('.fix').forEach(a=>a.addEventListener('click',()=>{ window.nhTrack&&nhTrack('remediation_click',{strand:a.dataset.strand}); }));
  $('report').onclick=makeReport;
  if($('again')) $('again').onclick=intro;
  window.nhTrack&&nhTrack('assessment_complete',{overall:overall,recall:P.recall,models:P.models,strategies:P.strategies,flex:P.flex,choice:P.choice,focus:focus,median_s:Math.round(med*10)/10,mode:inClass?'class':'free'});
}
boot();
</script>
</body>
